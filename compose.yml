services:
  api:
    build:
      context: .
    command: uv run api
    ports:
      - "3001:3001"
    env_file:
      - ./backend/api/.env
    environment:
      AMQP_URL: amqp://guest:guest@amqp:5672/
      PYTHONUNBUFFERED: "1"
    networks:
      - resland_network
    depends_on:
      amqp:
        condition: service_healthy

  dispatcher:
    build:
      context: .
    command: uv run dispatcher
    env_file:
      - ./backend/dispatcher/.env
    environment:
      AMQP_URL: amqp://guest:guest@amqp:5672/
      PYTHONUNBUFFERED: "1"
    networks:
      - resland_network
    depends_on:
      amqp:
        condition: service_healthy

  amqp:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - resland_network

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "resland"
      POSTGRES_PASSWORD: "resland"
    volumes:
      - db-data:/var/lib/postgresql/18/docker

networks:
  resland_network:
    driver: bridge

volumes:
  db-data:
