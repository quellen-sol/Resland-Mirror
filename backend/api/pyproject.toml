[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quellen-sol", email = "52678959+quellen-sol@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.93",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "puremagic>=2.2.0",
    "pyjwt[crypto]>=2.14.0",
    "python-multipart>=0.0.32",
    "shared",
    "stripe>=12.0.0",
    "typing>=3.10.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
api = "api:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.2,<7",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }
