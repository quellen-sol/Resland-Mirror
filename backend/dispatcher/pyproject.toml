[project]
name = "dispatcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quellen-sol", email = "52678959+quellen-sol@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.0",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "python-docx>=1.2.0",
    "shared",
]

[project.scripts]
dispatcher = "dispatcher:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }
